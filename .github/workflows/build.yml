name: Build SHTORM

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.shtorm --project-name shtorm .
          rm -rf test

      - name: Patch Android project
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle* || true
          sed -i 's/android:label="[^"]*"/android:label="SHTORM"/' android/app/src/main/AndroidManifest.xml
          sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: SHTORM-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows project
        shell: bash
        run: |
          flutter create --platforms=windows --org com.shtorm --project-name shtorm .
          rm -rf test
          sed -i 's/L"shtorm"/L"SHTORM"/' windows/runner/main.cpp

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Add Xray core and pack
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip" -OutFile xray.zip
          Expand-Archive xray.zip -DestinationPath xray
          $dir = "build/windows/x64/runner/Release"
          Copy-Item xray/xray.exe $dir
          Copy-Item xray/geoip.dat $dir
          Copy-Item xray/geosite.dat $dir
          Compress-Archive -Path "$dir/*" -DestinationPath SHTORM-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SHTORM-windows
          path: SHTORM-windows.zip
